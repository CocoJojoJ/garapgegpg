<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Serviços e textos | Administração Auto PGP</title>
<link rel="icon" href="img/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin" data-page="a-servicos">
<div class="admin-cadre">
<div id="admin-cote"></div>
<main class="admin-principal">
    <p class="bandeau-maquete" style="border-radius:6px;margin-bottom:18px">Maquete: nenhuma ação é guardada. O acesso real será protegido por palavra-passe.</p>
    <div class="admin-barre"><h1>Serviços e textos</h1><span class="qui">Ligado como <b>admin</b> · <a href="admin-connexion.html" style="text-decoration:underline">Sair</a></span></div>
    <form class="formulaire carte" data-maquete="Maquete: alterações não guardadas.">
        <h2 style="font-size:20px">Contactos</h2>
        <div class="deux">
            <label>Telefone<input value="+244 976 827 403"></label>
            <label>WhatsApp<input value="+244 976 827 403"></label>
            <label>Morada<input placeholder="A confirmar"></label>
            <label>Horário<input placeholder="A confirmar"></label>
        </div>
        <h2 style="font-size:20px;margin-top:10px">Texto de uma especialidade</h2>
        <label>Especialidade<select data-rendu="options-services"></select></label>
        <label>Texto por baixo da foto<textarea>Temos uma especialidade na reparação de pneus e na sua manutenção. Desde a sua chegada, diagnosticamos e reparamos o seu pneu na perfeição.</textarea></label>
        <label>Foto da especialidade<input type="file" accept="image/*" data-apercu="apercu-serv"></label>
        <div class="apercus" id="apercu-serv"></div>
        <label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto" checked> Mostrar na página inicial</label>
        <button class="btn" type="submit">Guardar</button>
        <p class="msg" role="status"></p>
    </form>

</main>
</div>
<script src="js/donnees.js"></script>
<script src="js/site.js"></script>
</body>
</html>
